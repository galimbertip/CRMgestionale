{% extends "base.html" %}
{% block title %}Imposta password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:30px auto">
  <h1>Imposta la password</h1>
  <p class="muted small">Inserisci l'email registrata: ti inviamo un link per scegliere una nuova password.</p>
  <form method="post">{% csrf_token %}
    {% include "includes/field.html" with field=form.email %}
    <button class="btn">Invia link</button>
  </form>
</div>
{% endblock %}
